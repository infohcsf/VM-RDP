services:
  windows:
    image: dockurr/windows
    container_name: windows10
    ports:
      - "8006:8006"
      - "3389:3389"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    dns:
      - 168.63.129.16
      - 1.1.1.1
      - 8.8.8.8
    environment:
      VERSION: "tiny10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "16G"
      DISK_FMT: "qcow2"
      ALLOCATE: "N"
    volumes:
      - ./data:/storage
    stop_grace_period: 2m
    restart: unless-stopped
