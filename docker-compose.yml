services:
  windows:
    image: dockurr/windows
    container_name: windows10
    environment:
      VERSION: "10"
      RAM_SIZE: "6G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
    volumes:
      - ./win-data:/storage
    stop_grace_period: 2m
    restart: on-failure
