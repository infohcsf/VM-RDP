services:
  windows:
    build: .
    container_name: windows10
    ports:
      - "6080:6080"
      - "3389:3389"
    devices:
      - /dev/kvm
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - MEMORY=4G
      - CPU_CORES=2
    volumes:
      - ./data:/data
      - ./iso:/iso
    restart: unless-stopped
