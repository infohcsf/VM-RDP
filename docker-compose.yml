services:
  windows:
    image: dockurr/windows
    container_name: windows10
    network_mode: host
    environment:
      VERSION: "10"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/storage
    stop_grace_period: 2m
    restart: unless-stopped
